name: Maeil News cards

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make the cards
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node generate.mjs

      - name: Save the new cards
        run: |
          git config user.name "maeil-news-bot"
          git config user.email "maeil-news-bot@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "Update cards"
          git push
