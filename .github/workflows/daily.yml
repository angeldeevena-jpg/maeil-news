name: Maeil News cards

on:
  schedule:
    # Once a day, at 10:17 in Seoul time (01:17 UTC)
    - cron: '17 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # One run per region, one after another, so they share the usage counter safely
      - name: Make the Korean cards
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          REGION: korean
        run: node generate.mjs

      - name: Make the Indian cards
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          REGION: indian
        run: node generate.mjs

      - name: Make the global cards
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          REGION: global
        run: node generate.mjs

      - name: Save the new cards
        run: |
          git config user.name "maeil-news-bot"
          git config user.email "maeil-news-bot@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -m "Update cards"
          git push
